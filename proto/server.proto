syntax = "proto3";

package limitless.server;

import "real_time_audio.proto";
import "shared.proto";

enum PendantSyncMode {
  PENDANT_SYNC_MODE_OFF = 0;
  PENDANT_SYNC_MODE_BLE_BATCH = 1;
  PENDANT_SYNC_MODE_BLE_REALTIME = 2;
  PENDANT_SYNC_MODE_WIFI = 3;
}

enum ServerCommandErrorCategory {
  SERVER_COMMAND_ERROR_CATEGORY_NONE = 0;
  SERVER_COMMAND_ERROR_CATEGORY_FAILED_TO_EXECUTE = 1;
}

enum BeamformDirection {
  BEAMFORM_DIRECTION_FRONT = 0;
  BEAMFORM_DIRECTION_LEFT = 1;
  BEAMFORM_DIRECTION_BACK = 2;
  BEAMFORM_DIRECTION_RIGHT = 3;
}

enum FlashPageError {
  FLASH_PAGE_ERROR_NONE = 0;
  FLASH_PAGE_ERROR_CRC = 1;
  FLASH_PAGE_ERROR_IO = 2;
}

enum DeviceIngestType {
  DEVICE_INGEST_TYPE_UNSPECIFIED = 0;
  DEVICE_INGEST_TYPE_REAL_TIME = 1;
  DEVICE_INGEST_TYPE_BATCH = 2;
  DEVICE_INGEST_TYPE_COMMAND = 3;
}

enum EnumC11446e {
  IDLE = 0;
  PREPARING_FOR_UPDATE = 1;
  UPLOADING_IMAGE = 2;
}

message AddWifiCredentials {
  limitless.shared.WiFiCredentials cred = 1;
}

message AuthenticateIngestMessage {
  string ingest_token = 1;
  string language = 2;
}

message AuthenticateSuccessAckMessage {
}

message BatchIngestRequest {
  repeated PendantAllMsg messages = 1;
  string ble_identifier = 2;
}

message ClearPendantStorage {
}

message ConnectToBackend {
}

message ConnectToWifi {
}

message DeleteFlashPage {
  uint32 older_than_or_equal_to_index = 1;
}

message DeviceInfoMsg {
  uint64 device_id = 1;
  string serial_num = 2;
  string firmware_ver = 3;
  uint32 storage_version = 4;
  uint64 storage_instance = 5;
  uint32 storage_run = 6;
  bytes wifi_mac_address1 = 7;
  bytes wifi_mac_address2 = 8;
  bytes ble_mac_address = 9;
  int32 oldest_flash_page = 10;
  int32 newest_flash_page = 11;
  int32 battery_percent = 12;
  SetDebugFeatures debug_features = 13;
  DeviceStatus device_status = 14;
  bytes device_audio_encryption_pub_key = 15;
  uint32 factory_reset_id = 16;
}

message DeviceStatus {
  limitless.shared.WifiStatus wifi_status = 1;
  SetServerInfo server_info = 2;
  SetVADThreshold vad_threshold = 3;
  uint32 led_brightness = 4;
  StorageState storage_state = 5;
  PendantSyncMode sync_mode = 6;
  limitless.shared.RecordingStatus recording_status = 7;
  bool has_all_fields = 8;
  limitless.shared.BatteryStatus battery_status = 9;
}

message DisconnectWifi {
}

message DownloadFlashPages {
  bool batch_mode_enabled = 1;
  bool real_time_mode_enabled = 2;
}

message FactoryResetPendant {
}

message GetDeviceInfo {
}

message GetDeviceStatus {
}

message PendantAllMsg {
  ResponseData response_data = 6;
  oneof content {
    DeviceInfoMsg device_info = 1;
    StorageBufferMsg storage_buffer = 2;
    SetCurrentTimeResponse set_current_time_response = 3;
    AuthenticateIngestMessage authenticate_ingest = 4;
    DeviceStatus device_status = 5;
    limitless.shared.BatteryStatus battery_status = 7;
    limitless.shared.ButtonStatus button_status = 8;
    limitless.real_time_audio.RealTimeAudioData real_time_audio_data = 9;
    limitless.real_time_audio.RealTimeAudioAck real_time_audio_ack = 10;
  }
}

message PrepareForFirmwareUpdate {
}

message PushOpusFrames {
  bytes opus_packet = 1;
  repeated int32 frame_sizes = 2;
  uint64 first_frame_index = 3;
}

message RequestData {
  int64 request_id = 1;
  bool do_not_ack = 2;
}

message ResetDevice {
}

message ResponseData {
  int64 request_id = 1;
  ServerCommandRequestError error = 2;
}

message ServerCommandMsg {
  RequestData request_data = 30;
  oneof content {
    SetManufacturingMode set_manufacturing_mode = 1;
    SetMacAddress set_mac_address = 2;
    SetLed set_led = 3;
    AddWifiCredentials add_wifi_credentials = 4;
    SetBLEPair set_ble_pair = 5;
    SetCurrentTime set_current_time = 6;
    DeleteFlashPage delete_flash_page = 7;
    DownloadFlashPages download_flash_pages = 8;
    SetIngestToken set_ingest_token = 9;
    FactoryResetPendant factory_reset_pendant = 10;
    ResetDevice reset_device = 11;
    AuthenticateSuccessAckMessage authenticate_success_ack = 12;
    SetDeviceName set_device_name = 13;
    GetDeviceInfo get_device_info = 14;
    UnpairBluetooth unpair_bluetooth = 15;
    SetDebugFeatures set_debug_features = 16;
    StartRecording start_recording = 17;
    StopRecording stop_recording = 18;
    ConnectToWifi connect_to_wifi = 19;
    ConnectToBackend connect_to_backend = 20;
    GetDeviceStatus get_device_status = 21;
    SetServerInfo set_server_info = 22;
    DisconnectWifi disconnect_wifi = 23;
    SetVADThreshold set_vad_threshold = 24;
    ClearPendantStorage clear_pendant_storage = 25;
    SetLEDBrightness set_led_brightness = 26;
    SetDeviceOnShippingMode set_device_on_shipping_mode = 27;
    SetServerPublicKey set_audio_encryption_server_public_key = 28;
    PrepareForFirmwareUpdate prepare_for_firmware_update = 29;
    SyncFirmwareUpdateState sync_firmware_update_state = 31;
    PushOpusFrames push_opus_frames = 32;
    limitless.real_time_audio.RealTimeAudioAck real_time_audio_ack = 33;
    limitless.real_time_audio.RealTimeAudioData real_time_audio_data = 34;
  }
}

message ServerCommandRequestError {
  ServerCommandErrorCategory category = 1;
  string error_message = 2;
}

message SetBLEPair {
  string ble_pair = 1;
}

message SetCurrentTime {
  uint64 unix_timestamp_ms = 1;
}

message SetCurrentTimeResponse {
  uint64 rtc_sync_relative_timestamp = 1;
  uint32 invalid_rtc_reset_count = 2;
  uint32 rtc_sync_session_number = 3;
}

message SetDebugFeatures {
  bool should_output_raw_omni_data = 1;
  bool should_output_raw_pdm_data = 2;
  bool should_output_raw_beamforming = 3;
  bool should_manually_beamform = 4;
  BeamformDirection manual_beamform_direction = 5;
  bool allow_recording_on_usb = 6;
  bool print_stopwatch_times = 7;
  bool print_ble_connection_info = 8;
  bool show_debug_led = 9;
  bool should_use_omni_and_skip_beamforming = 10;
}

message SetDeviceName {
  string name = 1;
}

message SetDeviceOnShippingMode {
}

message SetIngestToken {
  string ingest_token = 1;
}

message SetLed {
  bool red_enabled = 1;
  bool green_enabled = 2;
  bool blue_enabled = 3;
}

message SetLEDBrightness {
  uint32 brightness = 1;
}

message SetMacAddress {
  bytes mac_address1 = 1;
  bytes mac_address2 = 2;
}

message SetManufacturingMode {
  bool enabled = 1;
}

message SetServerInfo {
  string server_url = 1;
  string server_port = 2;
}

message SetServerPublicKey {
  bytes server_pub_key = 1;
}

message SetVADThreshold {
  uint32 vad_threshold_ms = 1;
}

message StartRecording {
}

message StopRecording {
}

message StorageBufferMsg {
  DeviceIngestType ingest_type = 1;
  int32 session = 2;
  int32 run = 3;
  int64 seq = 4;
  int32 index = 5;
  bytes flash_page = 6;
  FlashPageError flash_page_error = 7;
}

message StorageState {
  uint32 oldest_flash_page = 1;
  int32 newest_flash_page = 2;
  uint32 current_storage_session = 3;
  uint32 free_capture_pages = 4;
  uint32 total_capture_pages = 5;
}

message SyncFirmwareUpdateState {
  EnumC11446e state = 1;
}

message UnpairBluetooth {
  bool do_not_reset_device = 1;
}
